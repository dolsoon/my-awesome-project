[project]
name = "ai-facilitator-agent"
version = "0.1.0"
description = "AI Facilitator Agent for Google Docs Collaboration"
authors = [{name = "Research Team"}]
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client==2.187.0",
    "google-auth==2.30.0",
    "google-auth-oauthlib==1.2.0",
    "flask==3.1.2",
    "redis==5.0.0",
    "celery==5.4.0",
    "google-generativeai==0.5.0",
    "tiktoken>=0.7.0",
    "rich==13.7.0",
    "click==8.1.7",
    "prompt-toolkit==3.0.43",
    "questionary==2.0.1",
    "structlog==24.1.0",
    "cryptography==41.0.7",
    "python-dotenv==1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
